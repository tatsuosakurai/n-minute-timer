<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N Minute Timer</title>
  <style>
    :root {
      color-scheme: dark;
      --fg: #fffbe6;
      --fg-faint: rgba(255, 251, 230, 0.3);
      --ink: #1a1340;
      --unfilled: #14142b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--unfilled);
    }

    body {
      font-family: "Helvetica Neue", "Hiragino Sans", system-ui, sans-serif;
      color: var(--fg);
    }

    #scene {
      --elapsed-ratio: 0;
      --bar-color: transparent;
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 0 20px;
      overflow: hidden;
      background: var(--unfilled);
    }

    #elapsed-bar {
      position: absolute;
      inset: 0;
      z-index: -1;
      background: var(--bar-color);
      transform: scaleX(var(--elapsed-ratio));
      transform-origin: left;
    }

    #display {
      --char-count: 5;
      --widest-glyph-em: 0.6;
      --width-taken-by-controls: 170px;
      font-size: min(
        calc((100vw - var(--width-taken-by-controls)) / (var(--char-count) * var(--widest-glyph-em))),
        68vh
      );
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1;
      pointer-events: none;
      text-align: center;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.35);
      white-space: nowrap;
    }

    #controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    #buttons {
      display: flex;
      gap: 8px;
    }

    button {
      color: inherit;
      cursor: pointer;
      font: inherit;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.4;
    }

    .icon-btn {
      display: inline-flex;
      width: 36px;
      height: 36px;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: none;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
    }

    .icon-btn.primary {
      background: var(--fg);
      color: var(--ink);
    }

    .icon-btn.ghost {
      border: 1px solid var(--fg-faint);
      background: transparent;
    }

    #minutes-setting {
      display: flex;
      align-items: baseline;
      gap: 2px;
      font-size: 12px;
      opacity: 0.65;
    }

    #minutes-setting:hover,
    #minutes-setting:focus-within {
      opacity: 1;
    }

    #minutes-input {
      width: 44px;
      padding: 1px 2px;
      border: none;
      border-bottom: 1px solid transparent;
      background: transparent;
      color: inherit;
      font: inherit;
      font-variant-numeric: tabular-nums;
      outline: none;
      text-align: right;
    }

    #minutes-input::-webkit-inner-spin-button {
      opacity: 1;
    }

    #minutes-input:hover:not(:disabled),
    #minutes-input:focus {
      border-bottom-color: var(--fg-faint);
    }

    #minutes-input:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <main id="scene" aria-label="N minute timer">
    <div id="elapsed-bar" aria-hidden="true"></div>
    <div id="display" aria-live="polite">05:00</div>

    <section id="controls" aria-label="Timer controls">
      <div id="buttons">
        <button class="icon-btn primary" id="start-button" type="button" aria-label="スタート">▶</button>
        <button class="icon-btn ghost" id="reset-button" type="button" aria-label="リセット">↺</button>
      </div>
      <label id="minutes-setting">
        <input id="minutes-input" type="number" min="1" max="999" step="1" value="5">
        <span>分</span>
      </label>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
